<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distill — Built for people. Read by machines.</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">

  <style>
    /* =========================================================================
       Tokens & Global Reset
       ========================================================================= */
    :root {
      --sans: "Inter", system-ui, -apple-system, sans-serif;
      --serif: "Newsreader", Georgia, serif;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;

      --bg: #EEF0F2;
      --ink: #0F1115;
      --body: #2A2E35;
      --muted: #8B9098;
      --code: #7A7F88;
      --comment: #B3B8BF;
      --hot: #FF5A1F;
      --hot-soft: #FFE1D3;

      --cw: 46vw;
      --ch: 52vh;
      --gap: 4.75vw;
      --top: 40.2vh;
    }

    @media (max-width: 767px) {
      :root {
        --cw: 84vw;
        --ch: 54vw;
        --gap: 7vw;
        --top: 54svh;
      }
    }

    @media (max-width: 767px) and (max-height: 700px) {
      :root {
        --top: 58svh;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-user-select: none;
    }

    .stage {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg);
    }

    /* =========================================================================
       Top Nav Bar (56px tall, 20px padding, flex, 56px gap)
       ========================================================================= */
    .distill-nav {
      height: 56px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 56px;
      position: relative;
      z-index: 20;
    }

    .distill-brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--ink);
    }

    .distill-logo-drop {
      width: 19px;
      height: 23px;
      flex-shrink: 0;
      display: block;
    }

    .distill-brand-name {
      font-weight: 600;
      font-size: 23px;
      letter-spacing: -0.035em;
      color: var(--ink);
      line-height: 1;
    }

    .distill-links {
      display: flex;
      align-items: center;
      gap: 38px;
    }

    .distill-link {
      font-weight: 500;
      font-size: 13px;
      color: var(--body);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s ease;
      background: none;
      border: none;
      cursor: pointer;
    }

    .distill-link:hover {
      color: var(--ink);
    }

    .distill-link svg {
      opacity: 0.7;
    }

    .distill-nav-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 20px;
      font-weight: 500;
      font-size: 12.5px;
    }

    .distill-btn-signin {
      background: none;
      border: none;
      color: var(--body);
      cursor: pointer;
      font-weight: 500;
      font-size: 12.5px;
      padding: 0;
      transition: color 0.2s ease;
    }

    .distill-btn-signin:hover {
      color: var(--ink);
    }

    .distill-btn-trial {
      height: 32px;
      padding: 0 17px;
      border: 1px solid #C4C9CF;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 9999px;
      color: var(--body);
      font-weight: 500;
      font-size: 12.5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .distill-btn-trial:hover {
      background: rgba(255, 255, 255, 0.7);
      border-color: #A9B0B8;
      color: var(--ink);
    }

    .distill-btn-demo {
      height: 32px;
      padding: 0 17px;
      background: var(--hot);
      border: none;
      border-radius: 9999px;
      color: #FFFFFF;
      font-weight: 500;
      font-size: 12.5px;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .distill-btn-demo:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    @media (max-width: 767px) {
      .distill-nav {
        padding: 0 16px;
        gap: 0;
      }
      .distill-links,
      .distill-btn-signin,
      .distill-btn-trial {
        display: none !important;
      }
      .distill-btn-demo {
        height: 30px;
        padding: 0 13px;
        font-size: 12px;
      }
    }

    /* =========================================================================
       Hero Copy Grid
       ========================================================================= */
    .distill-hero-copy {
      display: grid;
      grid-template-columns: 1fr 34vw;
      gap: 4vw;
      padding: 30px 8.9vw 0;
      position: relative;
      z-index: 10;
    }

    .distill-hero-left {
      display: flex;
      flex-direction: column;
    }

    .distill-eyebrow {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 11.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--body);
    }

    .distill-headline {
      margin-top: 14px;
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(30px, 3vw, 58px);
      line-height: 1.05;
      letter-spacing: -0.025em;
      color: var(--ink);
    }

    .distill-headline em {
      font-style: italic;
      font-weight: 400;
    }

    .distill-hero-right {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .distill-paragraph {
      font-family: var(--sans);
      font-weight: 400;
      font-size: clamp(14px, 1.05vw, 19px);
      line-height: 1.55;
      color: var(--body);
      max-width: 34vw;
    }

    .distill-btn-explore {
      margin-top: 20px;
      height: 40px;
      padding: 0 22px;
      border-radius: 9999px;
      background: var(--hot);
      color: #FFFFFF;
      font-family: var(--sans);
      font-weight: 500;
      font-size: 13px;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(255, 90, 31, 0.25);
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.35s ease;
    }

    .distill-btn-explore:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(255, 90, 31, 0.4);
    }

    @media (max-width: 767px) {
      .distill-hero-copy {
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 18px 20px 0;
      }
      .distill-headline {
        font-size: 34px;
        margin-top: 8px;
      }
      .distill-paragraph {
        font-size: 14px;
        max-width: none;
      }
      .distill-btn-explore {
        margin-top: 14px;
      }
    }

    /* =========================================================================
       The Belt & Layers
       ========================================================================= */
    .distill-belt {
      position: absolute;
      left: 0;
      width: 100%;
      top: calc(var(--top) - 70px);
      height: calc(var(--ch) + 140px);
      cursor: grab;
      touch-action: pan-y;
      overflow: visible;
      z-index: 5;
    }

    .distill-belt.is-dragging {
      cursor: grabbing;
    }

    .distill-codes {
      position: absolute;
      inset: 0;
      pointer-events: none;
      mask-image: linear-gradient(90deg, transparent 0, #000 24vw);
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 24vw);
    }

    @media (max-width: 767px) {
      .distill-codes {
        mask-image: linear-gradient(90deg, transparent 0, #000 30vw);
        -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 30vw);
      }
    }

    .distill-cards {
      position: absolute;
      inset: 0;
      pointer-events: auto;
    }

    .distill-canvas-fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8;
    }

    /* =========================================================================
       The Scanner Line & Glowing Halo
       ========================================================================= */
    .distill-scanner {
      position: absolute;
      left: 50%;
      top: calc(var(--top) - 14px);
      height: calc(var(--ch) + 40px);
      width: 0;
      pointer-events: none;
      z-index: 15;
    }

    .distill-scanner-core {
      position: absolute;
      top: 0;
      left: -2px;
      width: 4px;
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(to bottom, #ff7a3c 0%, #FF5A1F 12%, #FF5A1F 88%, #ff7a3c 100%);
      box-shadow: 0 0 10px 2px rgba(255, 90, 31, 0.85), 0 0 34px 10px rgba(255, 90, 31, 0.38);
    }

    .distill-scanner-halo {
      position: absolute;
      top: 4%;
      left: 0;
      width: 42px;
      height: 92%;
      background: linear-gradient(to right, rgba(255, 110, 50, 0.55), transparent);
      filter: blur(6px);
      pointer-events: none;
    }

    /* =========================================================================
       Floating Counter Badge
       ========================================================================= */
    .distill-counter-badge {
      position: absolute;
      left: 50%;
      top: calc(var(--top) - 60px);
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      z-index: 18;
      pointer-events: none;
    }

    .distill-counter-label {
      font-family: var(--sans);
      font-size: 11.5px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: -0.01em;
    }

    .distill-counter-pill {
      height: 26px;
      border-radius: 9999px;
      overflow: hidden;
      box-shadow: 0 0 18px rgba(255, 90, 31, 0.35);
      font-family: var(--mono);
      font-weight: 500;
      font-size: 12.5px;
      display: inline-flex;
      align-items: center;
    }

    .distill-counter-num {
      background: var(--hot);
      color: #FFFFFF;
      padding: 0 11px 0 13px;
      min-width: 8.2ch;
      text-align: right;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
    }

    .distill-counter-pct {
      background: var(--hot-soft);
      color: #D9430F;
      font-size: 11px;
      padding: 0 12px 0 10px;
      display: flex;
      align-items: center;
      height: 100%;
      white-space: nowrap;
    }

    /* =========================================================================
       Card Elements (Scale via cqw)
       ========================================================================= */
    .k-card {
      position: absolute;
      top: 70px;
      left: 0;
      width: var(--cw);
      height: var(--ch);
      border-radius: 1.6vw;
      overflow: hidden;
      color: #FFFFFF;
      font-family: var(--sans);
      user-select: none;
      -webkit-user-select: none;
      container-type: inline-size;
      will-change: transform, clip-path;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.25);
    }

    /* Shared Card Nav */
    .k-nav {
      position: absolute;
      left: 4.4cqw;
      right: 4.4cqw;
      top: 4cqw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .k-brand {
      display: inline-flex;
      align-items: center;
    }

    .k-logo-svg {
      width: 5.4cqw;
      height: 4.2cqw;
      display: block;
    }

    .k-brand-name {
      font-weight: 500;
      font-size: 4.6cqw;
      letter-spacing: -0.03em;
      margin-left: 1.3cqw;
      line-height: 1;
    }

    .k-menu {
      display: flex;
      gap: 3.4cqw;
      font-weight: 500;
      font-size: 1.32cqw;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.85;
      align-items: center;
    }

    .k-menu span {
      position: relative;
    }

    .k-menu .k-pill {
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 9999px;
      padding: 0.7cqw 1.6cqw;
      margin: -0.7cqw -1.6cqw;
    }

    /* Card 1: Home (Dunes) */
    .k-card-home {
      background: linear-gradient(to bottom, rgba(20, 10, 4, 0.25) 0%, transparent 30%, rgba(20, 10, 4, 0.55) 100%),
                  url("https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/0e201fcd-ffc0-46a0-bd06-faa07bf0e84b.webp") center / cover no-repeat;
    }

    .k-home-bottom {
      position: absolute;
      left: 4.4cqw;
      right: 4.4cqw;
      bottom: 4.4cqw;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .k-home-stats {
      display: flex;
      align-items: flex-end;
      gap: 4cqw;
    }

    .k-home-stat {
      display: flex;
      flex-direction: column;
    }

    .k-home-num {
      font-weight: 300;
      font-size: 9cqw;
      line-height: 0.9;
      letter-spacing: -0.04em;
    }

    .k-home-lbl {
      font-size: 1.9cqw;
      opacity: 0.85;
      margin-top: 0.4cqw;
    }

    .k-home-rule {
      width: 1px;
      height: 8cqw;
      background: rgba(255, 255, 255, 0.35);
      margin-bottom: 0.5cqw;
    }

    .k-home-tagline {
      font-size: 2.2cqw;
      line-height: 1.25;
      width: 24cqw;
      text-align: right;
      opacity: 0.9;
    }

    /* Card 2: Price (Radial Gradient) */
    .k-card-price {
      background: radial-gradient(120% 90% at 20% 110%, #FF6A1F 0%, #FF9A4A 35%, #F7C79A 62%, #EFD9C4 100%);
      color: #2A1406;
    }

    .k-card-price .k-menu .k-pill {
      border-color: rgba(42, 20, 6, 0.6);
    }

    .k-price-figure {
      position: absolute;
      left: 4.4cqw;
      top: 38%;
      font-weight: 300;
      font-size: 13cqw;
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .k-price-dollar {
      font-size: 0.4em;
      vertical-align: 0.6em;
      margin-right: 0.1em;
    }

    .k-price-sub {
      position: absolute;
      left: 4.4cqw;
      top: 62%;
      font-family: var(--mono);
      font-size: 1.6cqw;
      opacity: 0.75;
      letter-spacing: 0.08em;
    }

    .k-price-plans {
      position: absolute;
      right: 4.4cqw;
      top: 34%;
      width: 36cqw;
      display: flex;
      flex-direction: column;
    }

    .k-plan-row {
      border-top: 1px solid rgba(42, 20, 6, 0.25);
      padding: 1.4cqw 0;
      display: flex;
      justify-content: space-between;
      font-size: 2.2cqw;
    }

    .k-plan-row.bold {
      font-weight: 600;
    }

    .k-price-btn {
      position: absolute;
      left: 4.4cqw;
      bottom: 4.4cqw;
      background: #2A1406;
      color: #F7E6D6;
      border-radius: 9999px;
      padding: 1.2cqw 2.8cqw;
      font-size: 1.8cqw;
      font-weight: 500;
      border: none;
      cursor: pointer;
    }

    /* Card 3: Case (Mineral) */
    .k-card-case {
      background: #190E08;
    }

    .k-case-bg {
      position: absolute;
      inset: 0;
      background: url("https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/2bebad68-8177-446a-9550-d64074166364.webp") center / cover no-repeat;
      filter: blur(1.4cqw) saturate(1.1);
      transform: scale(1.12);
      opacity: 0.7;
    }

    .k-case-veil {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(25, 14, 8, 0.15), rgba(25, 14, 8, 0.55));
    }

    .k-case-kicker {
      position: absolute;
      left: 4.4cqw;
      top: 17%;
      font-family: var(--mono);
      font-size: 1.4cqw;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.85;
      z-index: 2;
    }

    .k-case-title {
      position: absolute;
      left: 4.4cqw;
      top: 24%;
      font-family: var(--serif);
      font-size: 4.6cqw;
      line-height: 1.15;
      width: 56cqw;
      font-weight: 400;
      z-index: 2;
    }

    .k-case-stats {
      position: absolute;
      left: 4.4cqw;
      right: 4.4cqw;
      bottom: 4.4cqw;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 3cqw;
      z-index: 2;
    }

    .k-case-stat-col {
      border-top: 1px solid rgba(255, 255, 255, 0.35);
      padding-top: 1.2cqw;
    }

    .k-case-stat-val {
      font-weight: 300;
      font-size: 6cqw;
      line-height: 1;
    }

    .k-case-stat-lbl {
      font-size: 1.6cqw;
      opacity: 0.8;
      margin-top: 0.4cqw;
    }

    /* Card 4: Vision */
    .k-card-vision {
      background: #1B1311;
    }

    .k-vision-tiles {
      position: absolute;
      left: 4.4cqw;
      right: 4.4cqw;
      top: 21%;
      height: 46%;
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 2cqw;
      z-index: 2;
    }

    .k-vision-tile-img1 {
      border-radius: 1.4cqw;
      background: url("https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/e80ba08d-d7b6-4b27-b0cd-8d0ad09c788c.webp") center / cover no-repeat;
    }

    .k-vision-tile-img2 {
      border-radius: 1.4cqw;
      background: url("https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/62b0d7c1-3eb7-44bd-9b19-57b975fb250f.webp") center / cover no-repeat;
    }

    .k-vision-tile-quote {
      font-family: var(--serif);
      font-size: 3.4cqw;
      line-height: 1.2;
      display: flex;
      align-items: center;
      padding: 0 1cqw;
    }

    .k-vision-tile-quote em {
      opacity: 0.75;
      font-style: italic;
    }

    .k-vision-footer {
      position: absolute;
      left: 4.4cqw;
      right: 4.4cqw;
      bottom: 4.4cqw;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 1.6cqw;
      opacity: 0.7;
      line-height: 1.3;
      z-index: 2;
    }

    /* Card 5: Alloy (Fire) */
    .k-card-alloy {
      background: #140C08;
    }

    .k-alloy-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, transparent 50%, rgba(20, 12, 8, 0.7) 100%),
                  url("https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/156ff74d-ee37-4443-8f3a-11ae2095ed4c.webp") center / cover no-repeat;
      filter: blur(0.6cqw);
      transform: scale(1.06);
      opacity: 0.85;
    }

    .k-alloy-bottom-left {
      position: absolute;
      left: 4.4cqw;
      bottom: 4.4cqw;
      font-family: var(--serif);
      font-size: 7.4cqw;
      line-height: 0.98;
      font-weight: 400;
      z-index: 2;
    }

    .k-alloy-bottom-left em {
      font-style: italic;
    }

    .k-alloy-specs {
      position: absolute;
      right: 4.4cqw;
      bottom: 4.4cqw;
      width: 30cqw;
      display: flex;
      flex-direction: column;
      z-index: 2;
    }

    .k-spec-row {
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      padding: 1cqw 0;
      display: flex;
      justify-content: space-between;
      font-size: 1.8cqw;
    }

    /* Card 6: Journal */
    .k-card-journal {
      background: #E9ECF1;
      color: #121A2A;
    }

    .k-card-journal .k-menu {
      opacity: 0.7;
    }

    .k-card-journal .k-menu .k-pill {
      border-color: rgba(18, 26, 42, 0.4);
    }

    .k-journal-title {
      position: absolute;
      left: 4.4cqw;
      top: 23%;
      font-family: var(--serif);
      font-size: 5.6cqw;
      line-height: 1.05;
      font-weight: 400;
      color: #121A2A;
    }

    .k-journal-title em {
      font-style: italic;
      color: #46618E;
      font-size: 0.85em;
    }

    .k-journal-posts {
      position: absolute;
      left: 4.4cqw;
      right: 4.4cqw;
      bottom: 4.4cqw;
      display: grid;
      grid-template-columns: 1.25fr 1fr 1fr;
      gap: 2.2cqw;
    }

    .k-journal-post {
      display: flex;
      flex-direction: column;
    }

    .k-post-thumb {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 1.2cqw;
      margin-bottom: 1.2cqw;

                color = PALETTE[cIdx];
              }

              const jx = (hash(gx, row, 1) - 0.5) * 1.6;
              const jy = (hash(gx, row, 2) - 0.5) * 1.6;
              const sz = 1.1 + h2 * 1.7;

              ctx.fillStyle = color;
              ctx.fillRect(sx + jx, cardTop + row * 3 + jy, sz, sz);
            }
          }
        }

        // 3. Free Sparks
        for (let s = 0; s < 3; s++) {
          if (Math.random() < 0.70) {
            spawnSpark(cardTop, ch);
          }
        }
      }

      /* --- Main Animation Loop (60 FPS) --- */
      let lastTime = performance.now();
      const span = () => cw + gap;
      const period = () => span() * 6;

      function frame(now) {
        const dt = Math.min(0.064, (now - lastTime) / 1000);
        lastTime = now;
        const t = now / 1000;

        // Auto speed: -0.075 * W (leftward)
        const autoSpeed = -0.075 * W;

        // Hover ease to 35% speed
        const hoverTarget = isHovered ? 1 : 0;
        hoverVal += (hoverTarget - hoverVal) * Math.min(1, 4 * dt);
        const targetSpeed = autoSpeed * (1 - 0.65 * hoverVal);

        // Physics Easing
        if (!isDragging) {
          vel += (targetSpeed - vel) * (1 - Math.exp(-2.2 * dt));
          off += vel * dt;
        }

        // Clear Canvas FX
        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, fxCanvas.width / dpr, fxCanvas.height / dpr);

        const curSpan = span();
        const curPeriod = period();
        const cardTopInBelt = 70;

        let crossingCardIdx = -1;
        let crossingCut = 0;

        for (let i = 0; i < 6; i++) {
          // Wrapped position
          let x = ((off + i * curSpan + curSpan) % curPeriod);
          if (x < 0) x += curPeriod;
          x -= curSpan;

          const cut = Math.max(0, Math.min(cw, Lx - x));
          const cardEl = cardEls[i];
          const codeEl = codeEls[i];

          // 1. Position & Clip Card
          cardEl.style.transform = `translate3d(${x}px, 0, 0)`;
          if (cut > 0) {
            cardEl.style.clipPath = `inset(0 0 0 ${cut}px round 0 1.6vw 1.6vw 0)`;
            cardEl.style.webkitMaskImage = `linear-gradient(90deg, transparent ${cut}px, #000 ${cut + 26}px)`;
            cardEl.style.maskImage = `linear-gradient(90deg, transparent ${cut}px, #000 ${cut + 26}px)`;
          } else {
            cardEl.style.clipPath = 'none';
            cardEl.style.webkitMaskImage = 'none';
            cardEl.style.maskImage = 'none';
          }

          // 2. Position & Clip Twin Code
          codeEl.style.transform = `translate3d(${x}px, 0, 0)`;
          if (cut > 0) {
            codeEl.style.visibility = 'visible';
            codeEl.style.clipPath = `inset(0 ${cw - cut}px 0 0)`;
          } else {
            codeEl.style.visibility = 'hidden';
          }

          // 3. Dissolve FX on Crossing Card
          if (cut > 0 && (x + cw) > Lx) {
            crossingCardIdx = i;
            crossingCut = cut;
            drawDissolveFx(i, x, cardTopInBelt, cut, t);
          }
        }

        // Update sparks
        updateAndDrawSparks(dt, ctx);
        ctx.restore();

        // 4. Update Counter Badge
        if (crossingCardIdx !== -1) {
          activeCardIndex = crossingCardIdx;
          const card = CARDS_DATA[activeCardIndex];
          const progress = crossingCut / cw;
          const targetTokens = Math.round((card.original - card.distilled) * progress);

          shownTokens += (targetTokens - shownTokens) * Math.min(1, dt * 14);
          counterNum.textContent = '−' + Math.round(shownTokens).toLocaleString('en-US');
          counterPct.textContent = card.pct;
        }

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);

    })();
  </script>
</body>
</html>
