receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  # Data minimization: Strip sensitive financial tokens & card PANs before egress
  attributes:
    actions:
      - key: pan_token
        action: delete
      - key: secret_key
        action: delete
      - key: auth_token
        action: delete

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: paybridge

  logging:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, attributes]
      exporters: [logging]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, logging]

