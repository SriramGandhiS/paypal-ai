# PayBridge AI — Kafka Connect Authenticated Reverse Proxy Boundary
# Prevents unauthorized / unauthenticated access to Kafka Connect REST API
# Blocks external access to /connector-plugins/*/config/validate (CVE-2026-116593 mitigation)

events {
    worker_connections 1024;
}

http {
    upstream kafka_connect_backend {
        server connect:8083;
    }

    server {
        listen 8083;
        server_name localhost;

        # Disable verbose server headers
        server_tokens off;

        # Basic authentication for administrative operations
        # Note: In production, configure mTLS (ssl_verify_client on)
        auth_basic "PayBridge Kafka Connect Admin Gateway";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Block untrusted access to the vulnerable configuration validation endpoint
        location ~ ^/connector-plugins/[^/]+/config/validate$ {
            # Only allow internal administrative IPs / authenticated requests
            limit_except POST {
                deny all;
            }
            # Reject requests unless explicitly carrying internal admin authorization header
            if ($http_x_paybridge_admin_auth != "paybridge_internal_authorized") {
                return 403 '{"error": "Access to config validation is restricted to internal administrators"}';
            }
            proxy_pass http://kafka_connect_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Allow standard connector operational queries to authenticated users
        location / {
            proxy_pass http://kafka_connect_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 90;
        }
    }
}
