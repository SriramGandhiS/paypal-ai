name: Code Quality, Lint & Typecheck

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-backend:
    name: Go Vet & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: services/api/go.mod

      - name: Go Vet
        run: |
          cd services/api
          go vet ./...

  typecheck-frontend:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        run: |
          cd apps/web
          npm install

      - name: Compile TypeScript & Vite Build
        run: |
          cd apps/web
          npm run build
